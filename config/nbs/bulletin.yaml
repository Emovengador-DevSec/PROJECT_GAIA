# Configuración del Boletín Radial Comunitario «GAIA Voz»
# Fase 4.1 del Plan Maestro (doc 23)

# Emisoras: vacío a propósito. Agregar solo emisoras confirmadas por el equipo,
# con nombre, frecuencia y fuente (licencia MTC o contacto directo).
stations: []

formats:
  radio_spot:
    target_duration_seconds: 45
    words_per_minute: 130
  sms_compact:
    max_characters: 160
    encoding: "GSM-7"
  whatsapp_share:
    include_emojis: true
    include_url: true

quechua:
  variant: "Quechua Chanka (Ayacucho)"
  review_status: "pendiente"  # cambiar a "revisado" solo tras revisión de un hablante
  disclaimer: "Borrador en quechua sin revisar por un hablante. No difundir hasta su revisión."
  # Audio quechua: solo grabación de una persona hablante, nunca voz sintética.
  recorded_audio: null  # p. ej. audio/qu/boletin_huanta.wav (en apps/web/public)
  vocabulary:
    satelite: "satélite radar"
    alerta: "qawapayana willakuy"
    vegetacion: "chakarukunapa kawsaynin / qurakuna"
    quebrada: "wayqu"
    cultivos: "chakrakuna"
    minka: "ayllu minka / llankay"
    agua: "yaku amachay"

disclaimers:
  mandatory_monitor: "Aviso de monitoreo. No reemplaza a INDECI ni a la autoridad local. Verificar en campo."
  quechua_mandatory_monitor: "Kayqa qawapayana willakuymi. Manam INDECIpa tukri willakuyninchu. Kikin allpapim qawakunan."
  sar_revisit_notice: "Observación satelital NISAR cada ~12 días. No es tiempo real continuo."
