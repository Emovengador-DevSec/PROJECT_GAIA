aoi: chosica-rimac
title: Cuando la quebrada baja
question: ¿Qué cambió en las quebradas de Chosica después de la temporada de lluvias?
audience_summary:
  publico: Lluvia y escorrentía en las quebradas de Chosica.
  tecnico: Cambio HH/HV entre fechas comparables · coherencia GUNW prevista.
hypotheses:
  - id: h1
    text: Los cauces activos mostrarán cambios de rugosidad (subidas o bajadas de HH) por depósito de material.
    test: Comparar cambio en HH a lo largo de las quebradas frente a laderas estables.
    status: por_verificar
physics: >
  HH es sensible a la rugosidad superficial y a la humedad. Un depósito fresco de detritos cambia la
  rugosidad y la constante dieléctrica, y por eso la intensidad de la señal.
human_factors: Ocupación urbana en conos de deyección.
complementary: [Precipitación GPM IMERG, reportes de INDECI, imagen óptica posterior]
future: Mapas rápidos de zonas afectadas tras lluvias intensas, aun con cielo cubierto.
steps:
  - { title: El valle del Rímac, layer: none, camera: overview, text: "Lima depende de este valle y de sus quebradas." }
  - title: Lluvia y escorrentía
    layer: none
    camera: zone
    context: gpm
    text: INDECI registró escorrentía en Chosica el 25 de febrero de 2026.
    points:
      - GPM muestra la intensidad estimada de lluvia ese día para contrastar el episodio con el radar.
  - { title: El cambio, layer: diff_hhhh, camera: oblique, text: "Cambios de rugosidad a lo largo de los cauces." }
