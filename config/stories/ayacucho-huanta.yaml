aoi: ayacucho-huanta
title: Ayacucho, las huellas que deja el fuego
question: ¿Qué cambios de vegetación muestran las observaciones radar en Huanta y La Mar durante 2026?
audience_summary:
  publico: Comparamos observaciones NISAR de la misma zona para localizar cambios en el territorio. Los focos de calor de NASA FIRMS ayudan a investigar si esos cambios coinciden con incendios.
  tecnico: Comparación GCOV HH/HV de la trayectoria 147 ascendente, marco 171, el 24 de junio y el 10 de octubre de 2026. La cobertura válida común es del 99,91 %. HV registra 3.607 ha con caída de señal, de las cuales 938,28 ha forman 498 manchas delimitadas. OPERA coincide con el 2,25 % de esas manchas. La atribución a incendios continúa por verificar.
hypotheses:
  - id: perdida_vegetacion
    text: Una caída persistente en HV, mayor que en HH y coincidente con focos FIRMS, sería compatible con pérdida de vegetación por incendio.
    test: Comparar HV y HH antes y después, revisar el área válida y contrastar con FIRMS, una imagen óptica y observaciones locales.
    status: por_verificar
  - id: recuperacion
    text: Un aumento posterior de HV podría ser compatible con recuperación de vegetación o con cambios en la humedad del suelo.
    test: Analizar cuatro o más fechas de la misma geometría y contrastar la evolución con precipitación e imagen óptica. Separar humedad de recuperación de biomasa.
    status: por_verificar
physics: >
  La polarización cruzada HV responde a dispersión de volumen en la vegetación. HH aporta
  información complementaria sobre superficie y humedad. Un incendio puede cambiar ambas señales,
  pero la retrodispersión por sí sola no identifica su causa. La banda L observa de día y de noche
  y atraviesa las nubes; el radar no mide la temperatura ni las llamas.
human_factors: Comunidades, actividad agrícola, quema de pastizales y caminos forman parte del contexto que debe verificarse con información local.
complementary: [NASA FIRMS para focos de calor, USGS para sismos, imagen óptica y observación local]
future: Series de vegetación y humedad para acompañar la recuperación del territorio. Las tendencias requieren al menos cuatro fechas y muestran incertidumbre.
steps:
  - title: Sudamérica y los Andes
    layer: none
    camera: overview
    text: Ayacucho forma parte de un territorio donde los procesos naturales y la actividad humana dejan huellas observables desde el espacio.
  - title: El contexto del fuego
    layer: none
    camera: zone
    text: Los focos de calor disponibles proceden de NASA FIRMS y conservan su fecha y confianza. Una detección de calor requiere contexto para atribuirla a un incendio.
  - title: Cómo se obtienen las observaciones
    layer: none
    camera: zone
    text: Una imagen óptica de luz visible depende de la iluminación solar y puede quedar tapada por nubes o humo. NISAR emite sus propios pulsos de microondas y registra el eco de día o de noche. FIRMS aporta focos térmicos en horas. NISAR repite la geometría orbital cada 12 días, y la publicación del producto añade demora.
  - title: La comparación radar
    layer: diff_hvhv
    camera: zone
    text: Desliza la cortina para explorar las observaciones NISAR. La comparación procesada usa HH/HV del 24 de junio y el 10 de octubre de 2026 y conserva el 99,91 % de la zona. Los mosaicos oficiales están disponibles como referencia adicional.
  - title: El territorio expuesto
    layer: diff_hvhv
    camera: oblique
    text: Abre una mancha en Observaciones para consultar población WorldPop 2025, cobertura ESA WorldCover 2021 y centros poblados OpenStreetMap a 2 km. La disponibilidad de cada fuente acompaña a la cifra. Son estimaciones de exposición territorial.
  - title: La vegetación desde otra fuente
    layer: none
    camera: zone
    context: opera
    text: Los rásteres originales OPERA del 13 de octubre contrastan toda la cobertura radar. Coinciden en 21,08 ha, el 2,25 % de las manchas HV delimitadas. Abre Calidad para consultar ambas métricas de concordancia y sus gránulos. Esta coincidencia limitada mantiene abierta la interpretación del cambio.
  - title: Seguir la recuperación
    layer: diff_hvhv
    camera: zone
    text: Una serie de cuatro fechas o más permite explorar tendencias con incertidumbre. La hipótesis de recuperación se contrasta con lluvias, imagen óptica y conocimiento local.
