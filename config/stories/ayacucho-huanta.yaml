aoi: ayacucho-huanta
title: Ayacucho · cambios de señal radar en cultivos y laderas
question: ¿Qué cambios de señal muestran las observaciones radar en Huanta y La Mar entre junio y octubre de 2026?
audience_summary:
  publico: Incendios o sequía, erosión o huaicos, laderas inestables tras sismos y estrés hídrico agrícola.
  tecnico: GCOV provisional · HH/HV · trayectoria 147 ascendente · marco 171.
hypotheses:
  - id: perdida_vegetacion
    text: Una caída persistente en HV, mayor que en HH y coincidente con focos FIRMS, sería compatible con pérdida de vegetación por incendio.
    test: Comparar HV y HH antes y después, revisar el área válida y contrastar con FIRMS, una imagen óptica y observaciones locales.
    status: por_verificar
  - id: recuperacion
    text: Un aumento posterior de HV podría ser compatible con recuperación de vegetación o con cambios en la humedad del suelo.
    test: Analizar cuatro o más fechas de la misma geometría y contrastar la evolución con precipitación e imagen óptica. Separar humedad de recuperación de biomasa.
    status: por_verificar
physics: >
  La polarización cruzada HV responde a dispersión de volumen en la vegetación. HH aporta
  información complementaria sobre superficie y humedad. Un incendio puede cambiar ambas señales,
  pero la retrodispersión por sí sola no identifica su causa. La banda L observa de día y de noche
  y atraviesa las nubes; el radar no mide la temperatura ni las llamas.
human_factors: Comunidades, actividad agrícola, quema de pastizales y caminos forman parte del contexto que debe verificarse con información local.
complementary: [NASA FIRMS para focos de calor, USGS para sismos, imagen óptica y observación local]
future: Series de vegetación y humedad para acompañar la recuperación del territorio. Las tendencias requieren al menos cuatro fechas y muestran incertidumbre.
steps:
  - title: Sudamérica y los Andes
    layer: none
    camera: overview
    observation: quake
    text: El recorrido sitúa Huamanga, Huanta y La Mar en los Andes.
  - title: El fuego como hipótesis
    layer: none
    camera: zone
    observation: fire
    text: Incendios como posible causa, por verificar.
    points:
      - Contrastar fecha y ubicación del cambio con focos históricos NASA FIRMS e imagen óptica.
      - Los focos recientes muestran actividad actual.
  - title: Cómo se obtienen las observaciones
    layer: none
    camera: zone
    context: nisar-gcov
    text: NISAR registra ecos de día y de noche a través de las nubes.
    points:
      - Una imagen óptica necesita luz solar y puede quedar oculta por nubes o humo.
      - FIRMS aporta focos térmicos en horas. NISAR repite la geometría cada 12 días, más el tiempo de publicación.
  - title: La comparación radar
    layer: diff_hvhv
    camera: zone
    action: changes
    text: Desliza la cortina del 24 de junio al 10 de octubre de 2026.
    points:
      - NISAR GCOV provisional · 99,91 % de cobertura válida común.
      - 3.607 ha con caída de señal HV · 938,28 ha agrupadas en 498 manchas.
  - title: El territorio expuesto
    layer: diff_hvhv
    camera: oblique
    observation: surface_change
    action: action
    text: Abre una mancha en Alertas para consultar exposición estimada.
    points:
      - Población de WorldPop 2025, cobertura ESA WorldCover 2021 y poblados OpenStreetMap a 2 km.
  - title: La vegetación desde otra fuente
    layer: none
    camera: zone
    context: opera
    action: quality
    text: OPERA del 13 de octubre coincide en 21,08 ha, el 2,25 % de las manchas HV.
    points:
      - Abre Calidad para consultar el contraste cuantitativo, su cobertura y sus gránulos. La causa sigue por verificar.
  - title: Seguir la recuperación
    layer: diff_hvhv
    camera: zone
    action: series
    text: Explorar una tendencia requiere al menos cuatro fechas comparables.
    points:
      - Contrastar una posible recuperación con lluvia, imagen óptica y conocimiento local.
  - title: Cultivos, laderas y lluvias
    layer: none
    camera: zone
    context: hls-optical
    action: agriculture
    text: Desliza la comparación óptica HLS del 22 de junio y el 8 de octubre.
    points:
      - Cultivos y clima detalla la superficie por pendiente. Cosecha, suelo desnudo y erosión siguen por verificar.
