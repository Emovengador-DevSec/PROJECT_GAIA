aoi: sabancaya
title: Un volcán que respira
question: ¿Se deforma el terreno alrededor del Sabancaya?
audience_summary:
  publico: El radar permite estudiar desplazamientos del terreno alrededor del volcán.
  tecnico: Desplazamiento en línea de visión con GUNW · procesamiento pendiente.
hypotheses:
  - id: h1
    text: Un patrón concéntrico de franjas alrededor del cráter indicaría inflación o deflación del edificio volcánico.
    test: Interferograma GUNW de dos fechas del mismo track; descartar efecto atmosférico comparando pares.
    status: por_verificar
physics: >
  La interferometría compara la fase de dos pasadas: cada ciclo completo de color equivale a unos
  12 cm de movimiento en la línea de visión en banda L.
human_factors: Ninguno directo; poblaciones del valle del Colca expuestas.
complementary: [Reportes del observatorio vulcanológico, catálogo sísmico]
future: Vigilancia continua de volcanes andinos remotos.
steps:
  - { title: Los Andes del sur, layer: none, camera: overview, text: "Volcanes activos en zonas de difícil acceso." }
  - title: El volcán en 2001
    layer: none
    camera: zone
    context: radarsat1
    text: RADARSAT-1 muestra el entorno del volcán en banda C.
    points:
      - Para medir deformación se necesitan pares NISAR y control de coherencia.
  - { title: Relieve 3D, layer: none, camera: oblique, text: "La deformación se mostrará sobre el relieve real (fase P1)." }
