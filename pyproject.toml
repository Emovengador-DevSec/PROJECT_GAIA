[project]
name = "bailando-sars"
version = "0.3.0"
description = "Cambios de la superficie terrestre con datos radar NISAR reales"
requires-python = ">=3.11"
dependencies = [
  "asf_search>=9",          # búsqueda y descarga NISAR (ASF DAAC)
  "earthaccess>=0.12",      # alternativa: búsqueda/streaming por short_name
  "h5py>=3.11",
  "h5netcdf>=1.3",
  "xarray>=2024.10",
  "rioxarray>=0.17",
  "rasterio>=1.4",
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.8",
  "pyyaml>=6",
  "fastapi[standard]>=0.115",
  "titiler.core>=0.19",     # teselas dinámicas desde COG
  "httpx>=0.27",
  "python-dotenv>=1",
  "shapely>=2.1",
  "pyproj>=3.6",
  "pillow>=11",
]

[project.scripts]
sarlab = "sarlab_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "pip-audit>=2.7"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["services/pipeline/src/sarlab_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["services/pipeline/tests", "services/api/tests"]
pythonpath = ["services/pipeline/src", "services/pipeline/tests", "services/api"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E702"]

[tool.ruff.lint.isort]
known-first-party = ["sarlab_pipeline", "app", "conftest"]
